<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">From room code to incident report</title><desc id="desc">Lobby changes need a host. Movement and results belong to the server.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#f7bc72"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:40px;font-weight:700;fill:#fff3d7}.sub{font-size:19px;fill:#b6cfc1}.heading{font-size:25px;font-weight:700;fill:#fff3d7}.body{font-size:18px;fill:#e0e9dd}.small{font-size:16px;fill:#b6cfc1}.tag{font-size:13px;font-weight:700;letter-spacing:1px;fill:#bde7b8}.number{font-size:35px;font-weight:700;fill:#f7bc72}.key{font-size:24px;font-weight:700;fill:#fff3d7}.accent{font-size:18px;font-weight:700;fill:#f7bc72}</style><rect width="1200" height="840" rx="24" fill="#0e2925"/><path d="M36 125H1164" stroke="#315c50"/><text x="40" y="64" class="title" >From room code to incident report</text><text x="40" y="99" class="sub" >Lobby changes need a host. Movement and results belong to the server.</text><rect x="35" y="230" width="260" height="168" rx="20" fill="#173d36" stroke="#315c50"/><text x="53" y="274" class="heading" >Created</text><text x="53" y="318" class="small" >Eight-character code</text><text x="53" y="345" class="small" >Four-hour lifetime begins</text><rect x="325" y="230" width="260" height="168" rx="20" fill="#173d36" stroke="#315c50"/><text x="343" y="274" class="heading" >Lobby</text><text x="343" y="318" class="small" >Up to four reserved seats</text><text x="343" y="345" class="small" >Guests ready; host launches</text><rect x="615" y="230" width="260" height="168" rx="20" fill="#173d36" stroke="#315c50"/><text x="633" y="274" class="heading" >Playing</text><text x="633" y="318" class="small" >Server advances physics</text><text x="633" y="345" class="small" >New entrants wait</text><rect x="905" y="230" width="260" height="168" rx="20" fill="#173d36" stroke="#315c50"/><text x="923" y="274" class="heading" >Results</text><text x="923" y="318" class="small" >Review win / loss / draw</text><text x="923" y="345" class="small" >New entrants still wait</text><path d="M299 314H318" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><path d="M589 314H608" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><path d="M879 314H898" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><path d="M1035 226V179H745V226" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><text x="890" y="163" class="tag" text-anchor="middle">HOST REMATCH</text><path d="M1035 405V458H455V405" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><text x="744" y="487" class="tag" text-anchor="middle">HOST RETURNS TO LOBBY → NEW PLAYERS CAN JOIN</text><rect x="35" y="539" width="550" height="175" rx="20" fill="#173d36" stroke="#315c50"/><rect x="615" y="539" width="550" height="175" rx="20" fill="#173d36" stroke="#315c50"/><text x="57" y="578" class="heading" >Disconnected?</text><text x="57" y="615" class="body" >Seat reserved for 20 seconds; fire is cleared.</text><text x="57" y="643" class="body" >A connected participant takes over the host role.</text><text x="57" y="671" class="body" >A valid token restores the same seat and race team.</text><text x="637" y="578" class="heading" >Room ends</text><text x="637" y="615" class="body" >Last departure / all reservations expire.</text><text x="637" y="643" class="body" >Maximum four hours from creation.</text><text x="637" y="671" class="body" >Deployment / restart can also remove room state.</text><text x="40" y="763" class="body" >Rooms are temporary. Browser-local records are stored separately from the room.</text><text x="40" y="813" class="small" >PUKMANTHA  /  v1.1.0  /  Documentation diagram</text></svg>