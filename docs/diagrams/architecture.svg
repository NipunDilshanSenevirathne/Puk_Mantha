<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">How the game fits together</title><desc id="desc">One browser renders your view. One room server decides what happens.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#f7bc72"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:40px;font-weight:700;fill:#fff3d7}.sub{font-size:19px;fill:#b6cfc1}.heading{font-size:25px;font-weight:700;fill:#fff3d7}.body{font-size:18px;fill:#e0e9dd}.small{font-size:16px;fill:#b6cfc1}.tag{font-size:13px;font-weight:700;letter-spacing:1px;fill:#bde7b8}.number{font-size:35px;font-weight:700;fill:#f7bc72}.key{font-size:24px;font-weight:700;fill:#fff3d7}.accent{font-size:18px;font-weight:700;fill:#f7bc72}</style><rect width="1200" height="840" rx="24" fill="#0e2925"/><path d="M36 125H1164" stroke="#315c50"/><text x="40" y="64" class="title" >How the game fits together</text><text x="40" y="99" class="sub" >One browser renders your view. One room server decides what happens.</text><rect x="40" y="180" width="330" height="315" rx="20" fill="#173d36" stroke="#315c50"/><rect x="435" y="180" width="330" height="315" rx="20" fill="#173d36" stroke="#315c50"/><rect x="830" y="180" width="330" height="315" rx="20" fill="#173d36" stroke="#315c50"/><rect x="62" y="201" width="119" height="30" rx="15" fill="#294f43"/><text x="76" y="222" class="tag" >PLAYER SIDE</text><rect x="457" y="201" width="135" height="30" rx="15" fill="#294f43"/><text x="471" y="222" class="tag" >CLOUDFLARE</text><rect x="852" y="201" width="146" height="30" rx="15" fill="#294f43"/><text x="866" y="222" class="tag" >ONE PER ROOM</text><text x="62" y="265" class="heading" >Browser</text><text x="62" y="304" class="body" >Three.js world + face sprites</text><text x="62" y="332" class="body" >Keyboard / touch / controller</text><text x="62" y="360" class="body" >UI, music, synthesized effects</text><text x="62" y="388" class="body" >Local records and settings</text><text x="62" y="450" class="accent" >Solo: physics runs here</text><text x="457" y="265" class="heading" >Worker</text><text x="457" y="304" class="body" >Serves built static assets</text><text x="457" y="332" class="body" >Creates eight-character codes</text><text x="457" y="360" class="body" >Routes room WebSockets</text><text x="457" y="388" class="body" >Provides ICE configuration</text><text x="457" y="450" class="accent" >src/worker.js</text><text x="852" y="265" class="heading" >GameRoom</text><text x="852" y="304" class="body" >Owns authoritative game state</text><text x="852" y="332" class="body" >Validates player intentions</text><text x="852" y="360" class="body" >Steps shared physics at 20 Hz</text><text x="852" y="388" class="body" >Broadcasts raft + crew state</text><text x="852" y="450" class="accent" >Temporary in-memory room</text><path d="M374 337H428" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><path d="M428 366H374" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><text x="402" y="320" class="small" text-anchor="middle">HTTPS</text><path d="M770 337H823" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><path d="M823 366H770" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><text x="796" y="320" class="small" text-anchor="middle">WS</text><text x="40" y="554" class="heading" >Voice follows a separate path</text><rect x="40" y="588" width="330" height="114" rx="20" fill="#173d36" stroke="#315c50"/><rect x="435" y="588" width="330" height="114" rx="20" fill="#173d36" stroke="#315c50"/><rect x="830" y="588" width="330" height="114" rx="20" fill="#173d36" stroke="#315c50"/><text x="62" y="625" class="accent" >Player A microphone</text><text x="62" y="657" class="body" >Optional, browser permission</text><text x="457" y="625" class="accent" >Direct WebRTC / TURN</text><text x="457" y="657" class="body" >Audio between participants</text><text x="852" y="625" class="accent" >Player B speakers</text><text x="852" y="657" class="body" >Local mute and volume control</text><path d="M374 640H428" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><path d="M770 640H823" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><text x="40" y="746" class="small" >The room server relays offers and ICE candidates; it does not record microphone audio.</text><text x="40" y="771" class="small" >Multiplayer needs the Worker + Durable Object. Static hosting alone serves only the website.</text><text x="40" y="813" class="small" >PUKMANTHA  /  v1.1.0  /  Documentation diagram</text></svg>