<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">A very unprofessional voyage</title><desc id="desc">Aim together. Fart together. Try to reach the finish with a raft left.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#f7bc72"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:40px;font-weight:700;fill:#fff3d7}.sub{font-size:19px;fill:#b6cfc1}.heading{font-size:25px;font-weight:700;fill:#fff3d7}.body{font-size:18px;fill:#e0e9dd}.small{font-size:16px;fill:#b6cfc1}.tag{font-size:13px;font-weight:700;letter-spacing:1px;fill:#bde7b8}.number{font-size:35px;font-weight:700;fill:#f7bc72}.key{font-size:24px;font-weight:700;fill:#fff3d7}.accent{font-size:18px;font-weight:700;fill:#f7bc72}</style><rect width="1200" height="840" rx="24" fill="#0e2925"/><path d="M36 125H1164" stroke="#315c50"/><text x="40" y="64" class="title" >A very unprofessional voyage</text><text x="40" y="99" class="sub" >Aim together. Fart together. Try to reach the finish with a raft left.</text><rect x="40" y="180" width="320" height="225" rx="20" fill="#173d36" stroke="#315c50"/><text x="62" y="229" class="number" >01</text><text x="62" y="272" class="heading" >Pick your crew</text><text x="62" y="312" class="body" >13 familiar faces.</text><text x="62" y="340" class="body" >Equal abilities.</text><text x="62" y="368" class="body" >Choose a course and mode.</text><rect x="440" y="180" width="320" height="225" rx="20" fill="#173d36" stroke="#315c50"/><text x="462" y="229" class="number" >02</text><text x="462" y="272" class="heading" >Board the raft</text><text x="462" y="312" class="body" >Create or join with a code.</text><text x="462" y="340" class="body" >2–4 online; guests ready up.</text><text x="462" y="368" class="body" >Solo skips the lobby.</text><rect x="840" y="180" width="320" height="225" rx="20" fill="#173d36" stroke="#315c50"/><text x="862" y="229" class="number" >03</text><text x="862" y="272" class="heading" >Aim + propel</text><text x="862" y="312" class="body" >Pick a travel direction.</text><text x="862" y="340" class="body" >Hold fire for gas bursts.</text><text x="862" y="368" class="body" >Crew impulses add together.</text><rect x="840" y="480" width="320" height="225" rx="20" fill="#173d36" stroke="#315c50"/><text x="862" y="529" class="number" >04</text><text x="862" y="572" class="heading" >Navigate</text><text x="862" y="612" class="body" >Dodge rocks and riverbanks.</text><text x="862" y="640" class="body" >Coast to save gas.</text><text x="862" y="668" class="body" >Opposite thrust slows you.</text><rect x="440" y="480" width="320" height="225" rx="20" fill="#173d36" stroke="#315c50"/><text x="462" y="529" class="number" >05</text><text x="462" y="572" class="heading" >Refuel + repair</text><text x="462" y="612" class="body" >Beans: gas and small repairs.</text><text x="462" y="640" class="body" >Checkpoints: hull repair.</text><text x="462" y="668" class="body" >Keep the boat above zero.</text><rect x="40" y="480" width="320" height="225" rx="20" fill="#173d36" stroke="#315c50"/><text x="62" y="529" class="number" >06</text><text x="62" y="572" class="heading" >Finish + retry</text><text x="62" y="612" class="body" >Review the incident report.</text><text x="62" y="640" class="body" >Bank local wins and records.</text><text x="62" y="668" class="body" >Rematch or change course.</text><path d="M367 294H432" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><path d="M767 294H832" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><path d="M1000 414V470" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><path d="M832 592H767" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><path d="M432 592H367" fill="none" stroke="#f7bc72" stroke-width="3" marker-end="url(#arrow)" /><text x="40" y="760" class="body" >Time Trial: beat the clock. Free Sailing: no deadline. Team Race: two independent rafts.</text><text x="40" y="813" class="small" >PUKMANTHA  /  v1.1.0  /  Documentation diagram</text></svg>