<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc"><title id="title">Your cockpit, your controls</title><desc id="desc">Choose a direction first. The gas does the moving.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0L9 4.5L0 9Z" fill="#f7bc72"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.title{font-size:40px;font-weight:700;fill:#fff3d7}.sub{font-size:19px;fill:#b6cfc1}.heading{font-size:25px;font-weight:700;fill:#fff3d7}.body{font-size:18px;fill:#e0e9dd}.small{font-size:16px;fill:#b6cfc1}.tag{font-size:13px;font-weight:700;letter-spacing:1px;fill:#bde7b8}.number{font-size:35px;font-weight:700;fill:#f7bc72}.key{font-size:24px;font-weight:700;fill:#fff3d7}.accent{font-size:18px;font-weight:700;fill:#f7bc72}</style><rect width="1200" height="840" rx="24" fill="#0e2925"/><path d="M36 125H1164" stroke="#315c50"/><text x="40" y="64" class="title" >Your cockpit, your controls</text><text x="40" y="99" class="sub" >Choose a direction first. The gas does the moving.</text><rect x="40" y="180" width="320" height="490" rx="20" fill="#173d36" stroke="#315c50"/><rect x="440" y="180" width="320" height="490" rx="20" fill="#173d36" stroke="#315c50"/><rect x="840" y="180" width="320" height="490" rx="20" fill="#173d36" stroke="#315c50"/><text x="64" y="230" class="heading" >Desktop</text><text x="464" y="230" class="heading" >Touch</text><text x="864" y="230" class="heading" >Controller</text><rect x="160" y="267" width="54" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="187" y="301" class="key" text-anchor="middle">W</text><rect x="96" y="327" width="54" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="123" y="361" class="key" text-anchor="middle">A</text><rect x="160" y="327" width="54" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="187" y="361" class="key" text-anchor="middle">S</text><rect x="224" y="327" width="54" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="251" y="361" class="key" text-anchor="middle">D</text><rect x="95" y="404" width="184" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="187" y="438" class="key" text-anchor="middle">SPACE</text><text x="64" y="498" class="body" >WASD / arrows: aim</text><text x="64" y="526" class="body" >Hold Space: propel</text><text x="64" y="554" class="body" >V: microphone toggle</text><text x="64" y="582" class="body" >Remap keys in Settings</text><rect x="560" y="267" width="54" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="587" y="301" class="key" text-anchor="middle">↑</text><rect x="496" y="327" width="54" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="523" y="361" class="key" text-anchor="middle">←</text><rect x="560" y="327" width="54" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="587" y="361" class="key" text-anchor="middle">↓</text><rect x="624" y="327" width="54" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="651" y="361" class="key" text-anchor="middle">→</text><rect x="495" y="404" width="184" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="587" y="438" class="key" text-anchor="middle">FART</text><text x="464" y="498" class="body" >Direction pad: aim</text><text x="464" y="526" class="body" >Hold FART: propel</text><text x="464" y="554" class="body" >Mic button: voice toggle</text><text x="464" y="582" class="body" >Landscape gives more room</text><circle cx="947" cy="321" r="49" fill="#294f43" stroke="#5c7d6b"/><circle cx="947" cy="321" r="23" fill="#66806c"/><rect x="1020" y="296" width="54" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="1047" y="330" class="key" text-anchor="middle">A</text><rect x="895" y="404" width="210" height="50" rx="9" fill="#294f43" stroke="#5c7d6b"/><text x="1000" y="438" class="key" text-anchor="middle">RIGHT TRIGGER</text><text x="864" y="498" class="body" >Left stick / D-pad: aim</text><text x="864" y="526" class="body" >A or right trigger: propel</text><text x="864" y="554" class="body" >Standard mapping required</text><text x="864" y="582" class="body" >Menus: use mouse or touch</text><rect x="40" y="700" width="1120" height="83" rx="20" fill="#294f43" stroke="#315c50"/><text x="63" y="733" class="accent" >Aim stays selected. Release fire to coast. Opposite thrust brakes the raft.</text><text x="63" y="763" class="body" >Choose Gentle / Normal / Boost in the HUD. Online rounds continue while your settings are open.</text><text x="40" y="813" class="small" >PUKMANTHA  /  v1.1.0  /  Documentation diagram</text></svg>